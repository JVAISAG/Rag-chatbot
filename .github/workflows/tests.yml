name: Tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Prepare tokenizer
        run: python scripts/prepare_models.py
      - name: Check dependencies and regressions
        run: |
          python -m pip check
          python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: research_workspace
          POSTGRES_PASSWORD: ci-only-local-password
          POSTGRES_DB: research_workspace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U research_workspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKSPACE_DB_USER: research_workspace
      WORKSPACE_DB_PASSWORD: ci-only-local-password
      WORKSPACE_DB_NAME: research_workspace
      WORKSPACE_DB_PORT: '5433'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - run: python scripts/prepare_models.py
      - run: python scripts/verify_workspace.py integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser regression checks
        working-directory: frontend
        run: |
          npm start > /tmp/workspace-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/documents.spec.ts tests/article-import.spec.ts tests/research.spec.ts
